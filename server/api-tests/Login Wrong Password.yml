info:
  name: Login Wrong Password
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseURL}}/api/auth/login"
  body:
    type: json
    data: |-
      {
        "login": "{{login}}",
        "password": "not-the-password"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("responds 401 Unauthorized", function () {
          expect(res.getStatus()).to.equal(401);
        });

        test("returns an error message", function () {
          expect(body.error).to.equal("Invalid login or password");
        });

        test("does not return a user or token", function () {
          expect(body).to.not.have.property("user");
          expect(body).to.not.have.property("token");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Same login as Register, wrong password.
