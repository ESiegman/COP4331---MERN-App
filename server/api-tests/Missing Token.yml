info:
  name: Missing Token
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseURL}}/api/users/{{userId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 401 without a token", function () {
          expect(res.getStatus()).to.equal(401);
          expect(res.getBody().error).to.equal("Authentication required");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Same request as Get My Account, but without a token.
