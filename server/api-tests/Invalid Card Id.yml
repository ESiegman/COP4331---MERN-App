info:
  name: Invalid Card Id
  type: http
  seq: 15

http:
  method: GET
  url: "{{baseURL}}/api/cards/not-an-id"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 400 for a malformed id", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getBody().error).to.include("Invalid cardId");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  An id that isn't a valid MongoDB ObjectId.
