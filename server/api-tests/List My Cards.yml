info:
  name: List My Cards
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseURL}}/api/users/{{userId}}/cards"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 200 with an array that includes the new card", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody()).to.be.an("array");
          expect(res.getBody().map((c) => c._id)).to.include(bru.getVar("cardId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  All cards owned by the logged-in user.
