info:
  name: Search Cards
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseURL}}/api/users/{{userId}}/cards?search=luff"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 200 with only matching cards", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody()).to.not.be.empty;
          for (const card of res.getBody()) {
            expect(`${card.playerName} ${card.teamName}`.toLowerCase()).to.include("luff");
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  search matches playerName or teamName, ignoring case.
