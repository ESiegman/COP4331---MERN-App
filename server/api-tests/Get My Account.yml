info:
  name: Get My Account
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseURL}}/api/users/{{userId}}"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 200 with the logged-in user", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody()._id).to.equal(bru.getVar("userId"));
          expect(res.getBody()).to.not.have.property("password");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Protected route. Needs the token saved by Login.
