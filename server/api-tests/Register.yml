info:
  name: Register
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseURL}}/api/users"
  body:
    type: json
    data: |-
      {
        "firstName": "Test",
        "lastName": "Student",
        "login": "{{newLogin}}",
        "password": "{{newPassword}}",
        "email": "student@example.com"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // A login can only be registered once, so use a new one each run
        bru.setVar("newLogin", `student${Date.now()}`);
        bru.setVar("newPassword", "Passw0rd!");
    - type: after-response
      code: |-
        // The login requests use this account
        if (res.getStatus() === 201) {
          bru.setVar("login", bru.getVar("newLogin"));
          bru.setVar("password", bru.getVar("newPassword"));
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("responds 201 Created", function () {
          expect(res.getStatus()).to.equal(201);
        });

        test("returns a confirmation message", function () {
          expect(body.message).to.equal("User registered successfully");
        });

        test("returns the new user without the password", function () {
          expect(body.user.login).to.equal(bru.getVar("newLogin"));
          expect(body.user).to.not.have.property("password");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Creates a new account and saves its login and password for the Login requests.
