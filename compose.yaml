# Local development stack: `docker compose up --build`
#   React (Vite, hot reload)  http://localhost:5173
#   API (node --watch)        http://localhost:5000/api/health
#   MongoDB (Atlas Local)     mongodb://root:devpassword@localhost:27017/?directConnection=true
name: mern-dev

x-mongo-env: &mongo-env
  MONGO_APP_DB: ${MONGO_APP_DB:-app}
  MONGO_APP_USER: ${MONGO_APP_USER:-app}
  MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-apppassword}

services:
  mongodb:
    image: mongodb/mongodb-atlas-local:8.0
    hostname: mongodb
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-devpassword}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb

  # One-shot: runs db/setup.js (e.g. create the app user), then exits.
  db-setup:
    build: ./db
    environment:
      <<: *mongo-env
      MONGO_ROOT_URI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:-devpassword}@mongodb:27017/?directConnection=true
    volumes:
      - ./db:/app
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy

  api:
    build:
      context: ./server
      target: dev
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_APP_USER:-app}:${MONGO_APP_PASSWORD:-apppassword}@mongodb:27017/${MONGO_APP_DB:-app}?directConnection=true
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      db-setup:
        condition: service_completed_successfully

  client:
    build:
      context: ./client
      target: dev
    environment:
      API_PROXY_TARGET: http://api:5000
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  mongo-data:
  mongo-config:
