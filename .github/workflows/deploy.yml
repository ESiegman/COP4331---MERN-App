name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || 'deploy-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_PREFIX: ghcr.io/esiegman/mern
  NODE_VERSION: 24

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Manual runs rebuild everything.
      db: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.db }}
      api: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.api }}
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web }}
      infra: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            db:
              - 'db/**'
            api:
              - 'server/**'
            web:
              - 'client/**'
            infra:
              - 'compose.prod.yaml'

  test:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: '*/package-lock.json'

      - name: API tests
        if: needs.changes.outputs.api == 'true'
        working-directory: server
        run: npm ci && npm test

      - name: Client build
        if: needs.changes.outputs.web == 'true'
        working-directory: client
        run: npm ci && npm run build

      - name: DB setup syntax check
        if: needs.changes.outputs.db == 'true'
        working-directory: db
        run: npm ci && node --check setup.js

  build:
    needs: [changes, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: db
            context: db
          - component: api
            context: server
          - component: web
            context: client
    steps:
      - name: Skip unchanged component
        id: gate
        run: echo "run=${{ needs.changes.outputs[matrix.component] }}" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - if: steps.gate.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      - if: steps.gate.outputs.run == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.gate.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.component != 'db' && 'prod' || '' }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    needs: [changes, build]
    if: >-
      github.event_name != 'pull_request' && (
        needs.changes.outputs.db == 'true' || needs.changes.outputs.api == 'true' ||
        needs.changes.outputs.web == 'true' || needs.changes.outputs.infra == 'true')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mern.esiegman.dev
    permissions:
      contents: read
      packages: read
    env:
      SSH_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Upload compose file
        run: scp compose.prod.yaml "$SSH_TARGET:/opt/mern/compose.yaml"

      # up -d only recreates containers that changed
      - name: Pull images and restart changed services
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh "$SSH_TARGET" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh "$SSH_TARGET" 'bash -se' <<'EOF'
            cd /opt/mern
            docker compose pull db-setup api web
            docker logout ghcr.io
            docker compose up -d --remove-orphans
            docker image prune -f
          EOF

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://mern.esiegman.dev/api/health; then exit 0; fi
            sleep 5
          done
          echo "Health check failed; recent logs:"
          ssh "$SSH_TARGET" 'cd /opt/mern && docker compose ps && docker compose logs --tail=50 db-setup api web'
          exit 1
